name: Restore schema minimal diff

on:
  push:
    branches:
      - fix/private-default-tts-role-emotion

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/private-default-tts-role-emotion
          fetch-depth: 0
      - name: Restore schema bytes and reapply focused entries
        run: |
          git fetch origin main
          git checkout origin/main -- _conf_schema.json
          python - <<'PY'
          from pathlib import Path

          p = Path("_conf_schema.json")
          raw = p.read_bytes()
          newline = "\r\n" if b"\r\n" in raw else "\n"
          text = raw.decode("utf-8")

          def nl(s):
              return s.replace("\n", newline)

          group_anchor = nl('''  "enable_group_tts_by_default": {\n    "title": "默认开启全部群语音",\n    "description": "所有群默认开启",\n    "hint": "开启后无需配置群组白名单或执行 /ttg。群组黑名单仍优先；/ttg-q 可临时关闭当前群，插件重启后恢复默认。",\n    "type": "bool",\n    "default": false\n  },\n''')
          private_block = group_anchor + nl('''  "enable_private_tts_by_default": {\n    "title": "默认开启全部私聊语音",\n    "description": "所有私聊默认开启",\n    "hint": "开启后无需在每个私聊执行 /tts-llm；/tts-q 可临时关闭当前私聊，插件重启后恢复默认。",\n    "type": "bool",\n    "default": true\n  },\n''')
          if text.count(group_anchor) != 1:
              raise SystemExit(f"group anchor count: {text.count(group_anchor)}")
          text = text.replace(group_anchor, private_block, 1)

          emotion_anchor = nl('''  "default_emotion_name": {\n    "title": "默认感情名称",\n    "description": "默认感情",\n    "hint": "固定情感模式下使用。必须已通过 /注册感情 注册，或已导入 emotions.json。",\n    "type": "string",\n    "default": "开心"\n  },\n''')
          role_emotion_block = emotion_anchor + nl('''  "character_default_emotions": {\n    "title": "角色默认感情",\n    "description": "按角色设置兜底感情",\n    "hint": "每行填写 角色=感情，例如 airi=平静、oka=平静、kisaki=开心。角色专属默认优先；未配置时尝试上方全局默认，再回落到该角色第一个已注册感情。",\n    "type": "list",\n    "items": {\n      "type": "string"\n    },\n    "default": []\n  },\n''')
          if text.count(emotion_anchor) != 1:
              raise SystemExit(f"emotion anchor count: {text.count(emotion_anchor)}")
          text = text.replace(emotion_anchor, role_emotion_block, 1)
          p.write_bytes(text.encode("utf-8"))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _conf_schema.json
          git commit -m "chore: preserve schema formatting"
          git push origin HEAD:fix/private-default-tts-role-emotion
