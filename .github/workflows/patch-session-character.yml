name: Patch session character integration

on:
  push:
    branches:
      - feature/session-character-bindings

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'wire session character bindings') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/session-character-bindings
      - name: Patch main.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('main.py')
          source = path.read_text(encoding='utf-8')

          import_anchor = 'from .external_apis import translate_text\n'
          import_replacement = import_anchor + 'from .session_character_bindings import SessionCharacterBindings\n'
          if 'from .session_character_bindings import SessionCharacterBindings' not in source:
              if import_anchor not in source:
                  raise SystemExit('import anchor not found')
              source = source.replace(import_anchor, import_replacement, 1)

          init_anchor = '''        plugin_data_dir = StarTools.get_data_dir("astrbot_plugin_genie_tts_llm")\n        emotions_file_path = plugin_data_dir / "emotions.json"\n        self.emotion_manager = EmotionManager(emotions_file_path)\n'''
          init_replacement = '''        plugin_data_dir = StarTools.get_data_dir("astrbot_plugin_genie_tts_llm")\n        emotions_file_path = plugin_data_dir / "emotions.json"\n        self.emotion_manager = EmotionManager(emotions_file_path)\n        self.session_character_bindings = SessionCharacterBindings(\n            plugin_data_dir / "session_characters.json"\n        )\n'''
          if 'self.session_character_bindings = SessionCharacterBindings(' not in source:
              if init_anchor not in source:
                  raise SystemExit('init anchor not found')
              source = source.replace(init_anchor, init_replacement, 1)

          resolve_anchor = '''        resolved_char = character_name\n        if not resolved_char:\n            if session_setting:\n                resolved_char = session_setting.get("character")\n                if not emotion_name:\n                    emotion_name = session_setting.get("emotion")\n            elif session_id in self.w_active_sessions:\n                resolved_char = self.session_w_settings.get(session_id, {}).get(\n                    "character"\n                )\n\n        if not resolved_char:\n            resolved_char = self.config.get("default_character")\n'''
          resolve_replacement = '''        resolved_char = character_name\n        if not resolved_char:\n            if session_setting:\n                resolved_char = session_setting.get("character")\n                if not emotion_name:\n                    emotion_name = session_setting.get("emotion")\n            else:\n                resolved_char = self.session_character_bindings.get(session_id)\n                if not resolved_char and session_id in self.w_active_sessions:\n                    resolved_char = self.session_w_settings.get(session_id, {}).get(\n                        "character"\n                    )\n\n        if not resolved_char:\n            resolved_char = self.config.get("default_character")\n'''
          if 'self.session_character_bindings.get(session_id)' not in source:
              if resolve_anchor not in source:
                  raise SystemExit('resolve anchor not found')
              source = source.replace(resolve_anchor, resolve_replacement, 1)

          command_anchor = '    @filter.llm_tool(name="genie_tts_speak")\n'
          command_block = '''    @filter.command("tts-role", alias={"语音角色"})\n    async def session_character_command(\n        self, event: AstrMessageEvent, character_name: str = ""\n    ):\n        """查看、设置或清除当前会话绑定的 Genie 角色。"""\n        session_id = event.unified_msg_origin\n        character_name = str(character_name or "").strip()\n        default_character = str(self.config.get("default_character") or "").strip()\n\n        if not character_name:\n            bound_character = self.session_character_bindings.get(session_id)\n            if bound_character:\n                yield event.plain_result(\n                    f"当前会话语音角色: {bound_character}（会话绑定）"\n                )\n            else:\n                yield event.plain_result(\n                    f"当前会话未单独绑定语音角色，将使用默认角色: {default_character}"\n                )\n            return\n\n        if character_name.lower() in {"default", "reset"} or character_name in {\n            "默认",\n            "清除",\n            "重置",\n        }:\n            self.session_character_bindings.clear(session_id)\n            logger.info(f"会话 [{session_id}] 已清除语音角色绑定。")\n            yield event.plain_result(\n                f"已清除本会话语音角色绑定，将使用默认角色: {default_character}"\n            )\n            return\n\n        if not self.emotion_manager.character_exists(character_name):\n            yield event.plain_result(\n                f"❌ 未找到角色 '{character_name}'。请先在 emotions.json 中注册该角色。"\n            )\n            return\n\n        self.session_character_bindings.set(session_id, character_name)\n        logger.info(\n            f"会话 [{session_id}] 已绑定 Genie 语音角色: {character_name}"\n        )\n        yield event.plain_result(\n            f"本会话语音角色已绑定为: {character_name}。AstrBot 重启后仍会保留。"\n        )\n\n'''
          if 'async def session_character_command(' not in source:
              if command_anchor not in source:
                  raise SystemExit('command anchor not found')
              source = source.replace(command_anchor, command_block + command_anchor, 1)

          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py
          if git diff --cached --quiet; then
            echo 'No patch needed.'
          else
            git commit -m 'feat: wire session character bindings'
            git push origin HEAD:feature/session-character-bindings
          fi
