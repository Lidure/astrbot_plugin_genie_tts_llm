name: One-time verify LLM tool extra metadata fix

on:
  push:
    branches:
      - fix/llm-tool-extra-ref

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/llm-tool-extra-ref

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile plugin entrypoint
        run: python -m py_compile main.py

      - name: Run full plugin regression suite
        run: python -m unittest discover -s tests -v
