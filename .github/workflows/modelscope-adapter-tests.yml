name: ModelScope Adapter Regression
on:
  push:
    branches: [main]
  pull_request:
jobs:
  adapter-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: >-
          python -m pytest -q
          tests/test_modelscope_inference.py
          tests/test_natural_pauses.py
          tests/test_session_character_bindings.py
          tests/test_private_tts_and_role_defaults.py
          tests/test_emotion_routing.py
          tests/test_llm_tool_extra_metadata.py
        env:
          PYTHONPATH: ${{ github.workspace }}
