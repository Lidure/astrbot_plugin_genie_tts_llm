name: Private TTS and role default tests

on:
  push:
    branches:
      - fix/private-default-tts-role-emotion
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run private TTS and role default tests
        run: python -m unittest tests.test_private_tts_and_role_defaults tests.test_emotion_routing tests.test_session_character_bindings -v
