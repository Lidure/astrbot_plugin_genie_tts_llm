name: Private TTS and role default tests

on:
  push:
    branches:
      - fix/private-default-tts-role-emotion
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run full plugin regression suite
        run: python -m unittest discover -s tests -v
