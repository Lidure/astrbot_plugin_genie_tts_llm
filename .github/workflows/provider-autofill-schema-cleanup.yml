name: One-time provider autofill schema cleanup

on:
  push:
    branches:
      - feat/provider-translation-emotion-autofill

permissions:
  contents: write

jobs:
  cleanup-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/provider-translation-emotion-autofill
          fetch-depth: 0
      - name: Restore schema formatting and add focused option
        shell: bash
        run: |
          git show origin/main:_conf_schema.json > _conf_schema.json
          python - <<'PY'
          from pathlib import Path

          path = Path("_conf_schema.json")
          data = path.read_bytes()
          marker = (
              b'      "enable_llm_emotion": {\n'
              b'        "title": "LLM \xe6\x83\x85\xe6\x84\x9f\xe8\xaf\x86\xe5\x88\xab",\n'
              b'        "description": "\xe7\x94\x9f\xe6\x88\x90\xe6\x83\x85\xe6\x84\x9f\xe6\xa0\x87\xe7\xad\xbe",\n'
              b'        "hint": "\xe5\xbc\x80\xe5\x90\xaf\xe5\x90\x8e\xe4\xbc\x9a\xe6\xb3\xa8\xe5\x85\xa5\xe6\x8f\x90\xe7\xa4\xba\xe8\xaf\x8d\xef\xbc\x8c\xe8\xa6\x81\xe6\xb1\x82 LLM \xe5\x9c\xa8\xe5\x9b\x9e\xe5\xa4\x8d\xe6\x9c\xab\xe5\xb0\xbe\xe6\xb7\xbb\xe5\x8a\xa0 [emotion=xxx] \xe6\xa0\x87\xe7\xad\xbe\xe3\x80\x82\xe4\xb8\xa4\xe7\xa7\x8d\xe2\x80\x9c\xe5\xa4\x96\xe8\xaf\xadTTS\xe5\x87\x86\xe5\xa4\x87\xe6\x96\xb9\xe5\xbc\x8f\xe2\x80\x9d\xe4\xb8\x8b\xe9\x83\xbd\xe7\x94\x9f\xe6\x95\x88\xef\xbc\x9aprovider_translation \xe9\x93\xbe\xe8\xb7\xaf\xe4\xbc\x9a\xe5\x85\x88\xe5\x89\xa5\xe7\xa6\xbb\xe6\xa0\x87\xe7\xad\xbe\xe5\x86\x8d\xe9\x80\x81\xe5\x8e\xbb\xe7\xbf\xbb\xe8\xaf\x91\xe3\x80\x82\xe5\x89\x8d\xe6\x8f\x90\xe6\x98\xaf\xe8\xa7\x92\xe8\x89\xb2\xe5\xb7\xb2\xe7\x94\xa8 /\xe6\xb3\xa8\xe5\x86\x8c\xe6\x84\x9f\xe6\x83\x85 \xe6\xb3\xa8\xe5\x86\x8c\xe8\xbf\x87\xe6\x83\x85\xe6\x84\x9f\xef\xbc\x8c\xe4\xb8\x94\xe4\xb8\x8b\xe6\x96\xb9 Prompt \xe4\xbf\x9d\xe7\x95\x99 {emotions} \xe5\x8d\xa0\xe4\xbd\x8d\xe7\xac\xa6\xef\xbc\x8c\xe5\x90\xa6\xe5\x88\x99\xe4\xbc\x9a\xe5\x9b\x9e\xe8\x90\xbd\xe9\xbb\x98\xe8\xae\xa4\xe6\x83\x85\xe6\x84\x9f\xe3\x80\x82",\n'
              b'        "type": "bool",\n'
              b'        "default": false\n'
              b'      },\n'
          )
          if data.count(marker) != 1:
              raise SystemExit(f"expected one enable_llm_emotion marker, got {data.count(marker)}")

          block = marker + (
              b'      "enable_provider_emotion_autofill": {\n'
              b'        "title": "Provider \xe8\x87\xaa\xe5\x8a\xa8\xe8\xa1\xa5\xe5\x88\xa4\xe6\x83\x85\xe6\x84\x9f",\n'
              b'        "description": "\xe7\xbf\xbb\xe8\xaf\x91\xe6\x97\xb6\xe9\xa1\xba\xe4\xbe\xbf\xe5\x88\xa4\xe6\x96\xad\xe6\x83\x85\xe6\x84\x9f",\n'
              b'        "hint": "\xe4\xbb\x85\xe5\x9c\xa8\xe2\x80\x9c\xe5\xa4\x96\xe8\xaf\xadTTS\xe5\x87\x86\xe5\xa4\x87\xe6\x96\xb9\xe5\xbc\x8f=provider_translation\xe2\x80\x9d\xe6\x97\xb6\xe7\x94\x9f\xe6\x95\x88\xe3\x80\x82\xe5\xbc\x80\xe5\x90\xaf\xe5\x90\x8e\xef\xbc\x8c\xe5\xa6\x82\xe6\x9e\x9c\xe6\x9c\xac\xe8\xbd\xae\xe6\xb2\xa1\xe6\x9c\x89\xe9\x80\x9a\xe8\xbf\x87 /sw \xe7\xad\x89\xe6\x96\xb9\xe5\xbc\x8f\xe5\x9b\xba\xe5\xae\x9a\xe6\x83\x85\xe6\x84\x9f\xef\xbc\x8c\xe4\xb9\x9f\xe6\xb2\xa1\xe6\x9c\x89\xe6\x9c\x89\xe6\x95\x88\xe7\x9a\x84 [emotion=xxx] \xe6\xa0\x87\xe7\xad\xbe\xef\xbc\x8c\xe7\xbf\xbb\xe8\xaf\x91 Provider \xe4\xbc\x9a\xe4\xbb\x8e\xe5\xbd\x93\xe5\x89\x8d\xe8\xa7\x92\xe8\x89\xb2\xe5\xb7\xb2\xe6\xb3\xa8\xe5\x86\x8c\xe6\x83\x85\xe6\x84\x9f\xe4\xb8\xad\xe8\x87\xaa\xe5\x8a\xa8\xe8\xa1\xa5\xe9\x80\x89\xe4\xb8\x80\xe4\xb8\xaa\xef\xbc\x9b\xe5\x88\xa4\xe5\xae\x9a\xe5\xa4\xb1\xe8\xb4\xa5\xe6\x97\xb6\xe4\xbb\x8d\xe5\x9b\x9e\xe8\x90\xbd\xe8\xa7\x92\xe8\x89\xb2\xe9\xbb\x98\xe8\xae\xa4\xe6\x83\x85\xe6\x84\x9f\xef\xbc\x8c\xe4\xb8\x8d\xe4\xbc\x9a\xe8\xa6\x86\xe7\x9b\x96\xe6\x98\xbe\xe5\xbc\x8f\xe6\x83\x85\xe6\x84\x9f\xe3\x80\x82\xe5\x8e\x9f\xe6\x9c\x89 /tts-w \xe8\x87\xaa\xe5\x8a\xa8\xe6\x83\x85\xe6\x84\x9f\xe6\xa8\xa1\xe5\xbc\x8f\xe4\xb8\x8d\xe4\xbe\x9d\xe8\xb5\x96\xe6\xad\xa4\xe5\xbc\x80\xe5\x85\xb3\xe3\x80\x82",\n'
              b'        "type": "bool",\n'
              b'        "default": false\n'
              b'      },\n'
          )
          path.write_bytes(data.replace(marker, block, 1))
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _conf_schema.json
          git commit -m "chore: keep schema diff focused"
          git push origin HEAD:feat/provider-translation-emotion-autofill
