name: Session character bindings tests

on:
  push:
    branches:
      - feature/session-character-bindings
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run session character tests
        run: python -m unittest tests.test_session_character_bindings -v
