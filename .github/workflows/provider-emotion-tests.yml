name: Provider emotion regression tests

on:
  push:
    branches:
      - fix/provider-emotion-session-binding
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run provider emotion tests
        run: python -m unittest tests.test_emotion_routing tests.test_session_character_bindings -v
