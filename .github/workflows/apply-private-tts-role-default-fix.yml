name: Apply private TTS role default fix

on:
  push:
    branches:
      - fix/private-default-tts-role-emotion

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/private-default-tts-role-emotion
      - name: Make private TTS default-on
        run: |
          python - <<'PY'
          from pathlib import Path

          main = Path("main.py")
          text = main.read_text(encoding="utf-8")
          old = 'self.config.get("enable_private_tts_by_default", False)'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f"expected 3 private default fallbacks, got {count}")
          main.write_text(text.replace(old, 'self.config.get("enable_private_tts_by_default", True)'), encoding="utf-8")

          schema = Path("_conf_schema.json")
          data = schema.read_text(encoding="utf-8")
          anchor = '''  "enable_private_tts_by_default": {\n    "title": "默认开启全部私聊语音",\n    "description": "所有私聊默认开启",\n    "hint": "开启后无需在每个私聊执行 /tts-llm；/tts-q 可临时关闭当前私聊，插件重启后恢复默认。",\n    "type": "bool",\n    "default": false\n  },\n'''
          replacement = anchor.replace('"default": false', '"default": true')
          if data.count(anchor) != 1:
              raise SystemExit(f"private schema anchor count: {data.count(anchor)}")
          schema.write_text(data.replace(anchor, replacement, 1), encoding="utf-8")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add main.py _conf_schema.json
          git commit -m "fix: default private TTS to enabled"
          git push origin HEAD:fix/private-default-tts-role-emotion
